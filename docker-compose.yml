services:
  database:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: produkter
    volumes:
      - ssr-db:/var/lib/postgresql/data
      - ./serverside-rendering/test.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  webserver:
    build:
      context: ./serverside-rendering
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    environment:
      PGUSER: postgres
      PGPASSWORD: mysecretpassword
      PGHOST: database
      PGPORT: 5432